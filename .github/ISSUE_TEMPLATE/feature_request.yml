name: Feature request
description: An idea for something STLer could do
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. If you are not sure yet, start a conversation in [Discussions](https://github.com/cagliostro1991/STLer/discussions/new?category=ideas) first, it is easier to shape an idea there.
        Wishing for a new file format? Use the "File format request" form instead.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in your way. Start from the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you tried or considered?
  - type: dropdown
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - "No, I only have the idea"
        - "Maybe, with some guidance"
        - "Yes, I will open a pull request"
