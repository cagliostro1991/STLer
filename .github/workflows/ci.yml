# Builds the CLI and the app and runs the self-check on every pull request and every push to main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make build
      - name: Self-check
        run: make test
      - name: Version file matches the code
        run: test "$(cat VERSION)" = "$(./build/stler version | awk '{print $2}')"
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title follows conventional commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          echo "$TITLE" | grep -E '^(feat|fix|docs|test|refactor|perf|chore|ci)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::Use a conventional title, for example 'fix(follow): rescan a changed folder'"; exit 1; }
