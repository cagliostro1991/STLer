# Closes issues that wait for the reporter for a long time. Nothing else is touched.
name: Stale
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          only-labels: needs-info
          days-before-stale: 21
          days-before-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: "Still waiting for the details asked above. If nothing comes in two weeks this issue is closed, you can reopen it any time."
          close-issue-message: "Closed for lack of details. Please reopen with the information asked for, or open a new issue."
